<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="elbg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f1411" />
      <stop offset="50%" stop-color="#141c17" />
      <stop offset="100%" stop-color="#0b100d" />
    </linearGradient>
    <radialGradient id="elglow" cx="30%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#9cad8f" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#9cad8f" stop-opacity="0" />
    </radialGradient>
  </defs>

  <rect width="800" height="500" fill="url(#elbg)" />
  <rect width="800" height="500" fill="url(#elglow)" />

  <!-- App Chrome -->
  <rect x="40" y="30" width="720" height="440" rx="16" fill="#131a15" fill-opacity="0.8" stroke="#9cad8f" stroke-opacity="0.25" stroke-width="1" />
  <rect x="40" y="30" width="720" height="46" rx="16" fill="#0d130f" fill-opacity="0.9" />
  <circle cx="68" cy="53" r="5" fill="#e06c75" opacity="0.8" />
  <circle cx="86" cy="53" r="5" fill="#e5c07b" opacity="0.8" />
  <circle cx="104" cy="53" r="5" fill="#98c379" opacity="0.8" />
  <text x="400" y="58" font-family="'Fraunces', serif" font-size="13" fill="#9cad8f" letter-spacing="1.5" text-anchor="middle" font-weight="600">ELSEWHERE · ISSUE NO. 07 · FIELD NOTES</text>

  <!-- Editorial layout: Left Big Photo Frame with Mountains silhouette -->
  <g transform="translate(76, 96)">
    <rect width="360" height="334" rx="12" fill="#1a251e" stroke="#ffffff" stroke-opacity="0.08" />
    <!-- Mountain Silhouette -->
    <path d="M 0 250 L 90 160 L 160 210 L 260 120 L 360 220 L 360 334 L 0 334 Z" fill="#0c120e" opacity="0.95" />
    <path d="M 60 280 L 150 200 L 220 250 L 310 170 L 360 220 L 360 334 L 60 334 Z" fill="#141c16" opacity="0.75" />
    <!-- Sun/Moon over mountains -->
    <circle cx="270" cy="100" r="28" fill="#e9d6a8" fill-opacity="0.85" />
    <!-- Coordinates caption -->
    <rect x="18" y="18" width="160" height="28" rx="14" fill="#0d130f" fill-opacity="0.75" />
    <text x="32" y="36" font-family="'Nunito', sans-serif" font-size="11" fill="#9cad8f" font-weight="700">64°08'N 21°56'W</text>
  </g>

  <!-- Right Editorial Typography Column -->
  <g transform="translate(466, 106)">
    <text x="0" y="24" font-family="'Nunito', sans-serif" font-size="11" fill="#9cad8f" font-weight="700" letter-spacing="2">ESSAY · THE SILENT VALLEY</text>
    <text x="0" y="70" font-family="'Fraunces', serif" font-size="34" fill="#f7f1e3" font-weight="500" line-height="1.1">Where the map ends,</text>
    <text x="0" y="108" font-family="'Fraunces', serif" font-size="34" fill="#9cad8f" font-style="italic">the real walk begins.</text>
    
    <text x="0" y="152" font-family="'Nunito', sans-serif" font-size="13" fill="#f7f1e3" opacity="0.65">A visual archive of paths seldom taken, preserved</text>
    <text x="0" y="174" font-family="'Nunito', sans-serif" font-size="13" fill="#f7f1e3" opacity="0.65">through medium format film and local diary fragments.</text>

    <!-- Reading metadata chip -->
    <rect x="0" y="206" width="268" height="64" rx="10" fill="#1a251e" fill-opacity="0.6" stroke="#9cad8f" stroke-opacity="0.2" />
    <text x="20" y="234" font-family="'Nunito', sans-serif" font-size="11" fill="#9cad8f" font-weight="700">READING TIME</text>
    <text x="20" y="254" font-family="'Fraunces', serif" font-size="15" fill="#f7f1e3">12 min slow read</text>
    
    <text x="160" y="234" font-family="'Nunito', sans-serif" font-size="11" fill="#9cad8f" font-weight="700">PHOTOGRAPHY</text>
    <text x="160" y="254" font-family="'Fraunces', serif" font-size="15" fill="#f7f1e3">35mm Kodak Gold</text>

    <!-- Passport Stamp -->
    <g transform="translate(190, 280)">
      <circle cx="36" cy="20" r="26" fill="none" stroke="#9cad8f" stroke-width="1.5" stroke-dasharray="4,3" opacity="0.6" />
      <text x="36" y="24" font-family="'Nunito', sans-serif" font-size="9" fill="#9cad8f" font-weight="700" text-anchor="middle" letter-spacing="1">ARCHIVE</text>
    </g>
  </g>
</svg>
