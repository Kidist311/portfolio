<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#120f18" />
      <stop offset="50%" stop-color="#181324" />
      <stop offset="100%" stop-color="#0e0b14" />
    </linearGradient>
    <radialGradient id="glow" cx="70%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#c9a86a" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#c9a86a" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="purpleGlow" cx="20%" cy="80%" r="50%">
      <stop offset="0%" stop-color="#6b46c1" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#6b46c1" stop-opacity="0" />
    </radialGradient>
  </defs>

  <rect width="800" height="500" fill="url(#bg)" />
  <rect width="800" height="500" fill="url(#glow)" />
  <rect width="800" height="500" fill="url(#purpleGlow)" />

  <!-- Stars -->
  <circle cx="120" cy="80" r="1.5" fill="#e9d6a8" opacity="0.6" />
  <circle cx="280" cy="140" r="1" fill="#e9d6a8" opacity="0.4" />
  <circle cx="680" cy="90" r="2" fill="#e9d6a8" opacity="0.8" />
  <circle cx="730" cy="220" r="1.2" fill="#e9d6a8" opacity="0.5" />
  <circle cx="90" cy="340" r="1.5" fill="#e9d6a8" opacity="0.5" />
  <circle cx="450" cy="70" r="1.8" fill="#e9d6a8" opacity="0.7" />

  <!-- Browser/App Chrome header -->
  <rect x="40" y="30" width="720" height="440" rx="16" fill="#1b1724" fill-opacity="0.75" stroke="#c9a86a" stroke-opacity="0.2" stroke-width="1" />
  <rect x="40" y="30" width="720" height="46" rx="16" fill="#14111d" fill-opacity="0.85" />
  <circle cx="68" cy="53" r="5" fill="#e06c75" opacity="0.8" />
  <circle cx="86" cy="53" r="5" fill="#e5c07b" opacity="0.8" />
  <circle cx="104" cy="53" r="5" fill="#98c379" opacity="0.8" />
  <text x="400" y="58" font-family="'Fraunces', serif" font-size="13" fill="#c9a86a" letter-spacing="1.5" text-anchor="middle" font-weight="600">AFTERGLOW · NIGHTLY RITUAL</text>

  <!-- Crescent moon graphic -->
  <g transform="translate(600, 160)">
    <circle cx="0" cy="0" r="44" fill="#c9a86a" fill-opacity="0.15" />
    <path d="M 0 -36 A 36 36 0 1 0 36 0 A 28 28 0 1 1 0 -36 Z" fill="#e9d6a8" />
    <circle cx="0" cy="0" r="52" fill="none" stroke="#c9a86a" stroke-dasharray="3,4" stroke-width="1" opacity="0.4" />
  </g>

  <!-- Left Main Card: Sleep score -->
  <rect x="76" y="104" width="320" height="180" rx="12" fill="#241e30" fill-opacity="0.8" stroke="#c9a86a" stroke-opacity="0.25" />
  <text x="100" y="136" font-family="'Nunito', sans-serif" font-size="11" fill="#c9a86a" font-weight="700" letter-spacing="2">WIND-DOWN STAGE</text>
  <text x="100" y="174" font-family="'Fraunces', serif" font-size="34" fill="#f7f1e3" font-weight="500">8 hrs 42 mins</text>
  <text x="100" y="202" font-family="'Nunito', sans-serif" font-size="13" fill="#f7f1e3" opacity="0.65">Deep restorative cycles completed</text>

  <!-- Progress bar -->
  <rect x="100" y="226" width="272" height="8" rx="4" fill="#14111d" />
  <rect x="100" y="226" width="224" height="8" rx="4" fill="url(#goldBar)" />
  <linearGradient id="goldBar" x1="0%" y1="0%" x2="100%" y2="0%">
    <stop offset="0%" stop-color="#9c7a3c" />
    <stop offset="100%" stop-color="#e9d6a8" />
  </linearGradient>
  <text x="100" y="258" font-family="'Nunito', sans-serif" font-size="11" fill="#e9d6a8" opacity="0.85">✦ Optimal parasympathetic relaxation</text>

  <!-- Right stats chips -->
  <rect x="424" y="240" width="150" height="74" rx="10" fill="#241e30" fill-opacity="0.7" stroke="#ffffff" stroke-opacity="0.08" />
  <text x="444" y="266" font-family="'Nunito', sans-serif" font-size="11" fill="#c9a86a" font-weight="700">HEART REST</text>
  <text x="444" y="296" font-family="'Fraunces', serif" font-size="22" fill="#f7f1e3">54 bpm</text>

  <rect x="590" y="240" width="144" height="74" rx="10" fill="#241e30" fill-opacity="0.7" stroke="#ffffff" stroke-opacity="0.08" />
  <text x="610" y="266" font-family="'Nunito', sans-serif" font-size="11" fill="#c9a86a" font-weight="700">WARM AMBIENCE</text>
  <text x="610" y="296" font-family="'Fraunces', serif" font-size="22" fill="#f7f1e3">2200 K</text>

  <!-- Wave chart at bottom -->
  <rect x="76" y="306" width="658" height="136" rx="12" fill="#241e30" fill-opacity="0.6" stroke="#ffffff" stroke-opacity="0.08" />
  <text x="100" y="336" font-family="'Nunito', sans-serif" font-size="11" fill="#c9a86a" font-weight="700" letter-spacing="1">NIGHTLY WAVE PATTERN</text>
  
  <path d="M 100 410 Q 180 360, 240 395 T 380 370 T 520 405 T 660 365 L 710 390" fill="none" stroke="#c9a86a" stroke-width="2.5" opacity="0.9" />
  <path d="M 100 410 Q 180 360, 240 395 T 380 370 T 520 405 T 660 365 L 710 390 L 710 430 L 100 430 Z" fill="#c9a86a" fill-opacity="0.08" />
</svg>
